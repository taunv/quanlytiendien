<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="4;url=https://script.google.com/macros/s/AKfycbz-czoUnKpRWZpEelyWe6raLkGL6fBGxmTIbtstwXaW8QlIeNhlGjdwpDDxHvuNYxE/exec">
<title>⚡ Quản Lý Tiền Điện Nhà Cho Thuê</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #04070f;
    --surface: #0a1628;
    --blue: #1565C0;
    --blue-bright: #2196F3;
    --yellow: #F9A825;
    --yellow-glow: #FBC02D;
    --text: #E8EDF8;
    --muted: #6B7F9E;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Be Vietnam Pro', sans-serif;
    overflow: hidden;
  }

  /* ── CANVAS BACKGROUND ── */
  canvas#bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.6;
  }

  /* ── GRID OVERLAY ── */
  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background-image:
      linear-gradient(rgba(21,101,192,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(21,101,192,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
  }

  /* ── GLOW ORBS ── */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    z-index: 1;
    animation: float 8s ease-in-out infinite;
  }
  .orb-1 {
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(21,101,192,0.25) 0%, transparent 70%);
    top: -150px; left: -150px;
    animation-delay: 0s;
  }
  .orb-2 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(249,168,37,0.15) 0%, transparent 70%);
    bottom: -100px; right: -100px;
    animation-delay: -4s;
  }
  .orb-3 {
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(33,150,243,0.12) 0%, transparent 70%);
    top: 50%; left: 60%;
    animation-delay: -2s;
  }
  @keyframes float {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(30px, -30px); }
    66% { transform: translate(-20px, 20px); }
  }

  /* ── MAIN CONTENT ── */
  .wrapper {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    text-align: center;
    max-width: 480px;
    width: 100%;
    animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    opacity: 0;
    transform: translateY(32px);
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── ICON ── */
  .icon-wrap {
    position: relative;
    width: 100px;
    height: 100px;
    margin: 0 auto 32px;
  }
  .icon-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(249,168,37,0.3);
    animation: ring-pulse 2.5s ease-in-out infinite;
  }
  .icon-ring-2 {
    position: absolute;
    inset: -14px;
    border-radius: 50%;
    border: 1px solid rgba(249,168,37,0.12);
    animation: ring-pulse 2.5s ease-in-out infinite 0.5s;
  }
  .icon-ring-3 {
    position: absolute;
    inset: -28px;
    border-radius: 50%;
    border: 1px solid rgba(249,168,37,0.06);
    animation: ring-pulse 2.5s ease-in-out infinite 1s;
  }
  @keyframes ring-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.05); }
  }
  .icon-core {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #F9A825 0%, #FF8F00 100%);
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    box-shadow:
      0 0 0 1px rgba(249,168,37,0.4),
      0 0 30px rgba(249,168,37,0.4),
      0 0 60px rgba(249,168,37,0.15),
      0 20px 40px rgba(0,0,0,0.4);
    animation: icon-glow 2.5s ease-in-out infinite;
  }
  @keyframes icon-glow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(249,168,37,0.4), 0 0 30px rgba(249,168,37,0.4), 0 0 60px rgba(249,168,37,0.15), 0 20px 40px rgba(0,0,0,0.4); }
    50% { box-shadow: 0 0 0 1px rgba(249,168,37,0.6), 0 0 50px rgba(249,168,37,0.6), 0 0 100px rgba(249,168,37,0.25), 0 20px 40px rgba(0,0,0,0.4); }
  }

  /* ── TYPOGRAPHY ── */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 14px;
    background: rgba(21,101,192,0.2);
    border: 1px solid rgba(33,150,243,0.3);
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #64B5F6;
    margin-bottom: 16px;
  }
  .tag::before {
    content: '';
    width: 6px; height: 6px;
    background: #64B5F6;
    border-radius: 50%;
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 38px);
    font-weight: 800;
    line-height: 1.15;
    margin-bottom: 12px;
    letter-spacing: -0.5px;
  }
  h1 .accent {
    background: linear-gradient(135deg, #F9A825, #FFD54F);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 40px;
    font-weight: 300;
  }

  /* ── CTA BUTTON ── */
  .btn-launch {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 36px;
    background: linear-gradient(135deg, #1565C0 0%, #1976D2 50%, #0288D1 100%);
    color: #fff;
    text-decoration: none;
    border-radius: 14px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.3px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow:
      0 0 0 1px rgba(33,150,243,0.3),
      0 8px 24px rgba(21,101,192,0.4),
      0 2px 4px rgba(0,0,0,0.3);
    position: relative;
    overflow: hidden;
  }
  .btn-launch::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .btn-launch:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow:
      0 0 0 1px rgba(33,150,243,0.5),
      0 16px 40px rgba(21,101,192,0.5),
      0 4px 8px rgba(0,0,0,0.3);
  }
  .btn-launch:hover::before { opacity: 1; }
  .btn-launch:active { transform: translateY(0) scale(0.99); }
  .btn-arrow {
    font-size: 20px;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .btn-launch:hover .btn-arrow { transform: translateX(4px); }

  /* ── PROGRESS BAR ── */
  .redirect-info {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .redirect-text {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  .redirect-text span {
    color: var(--yellow);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .progress-track {
    width: 200px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1565C0, #F9A825);
    border-radius: 99px;
    width: 0%;
    animation: progress 4s linear forwards;
    box-shadow: 0 0 8px rgba(249,168,37,0.5);
  }
  @keyframes progress {
    to { width: 100%; }
  }

  /* ── DIVIDER ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 32px 0;
    color: rgba(255,255,255,0.1);
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  /* ── FEATURES ── */
  .features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 32px;
  }
  .feat {
    padding: 14px 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    transition: all 0.3s;
    animation: cardIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  .feat:nth-child(1) { animation-delay: 0.15s; }
  .feat:nth-child(2) { animation-delay: 0.25s; }
  .feat:nth-child(3) { animation-delay: 0.35s; }
  .feat:hover {
    background: rgba(33,150,243,0.08);
    border-color: rgba(33,150,243,0.2);
    color: var(--text);
  }
  .feat .feat-icon { font-size: 20px; margin-bottom: 6px; display: block; }
  .feat .feat-label { font-size: 11px; font-weight: 500; }

  /* ── FOOTER ── */
  .footer {
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.18);
    z-index: 10;
    letter-spacing: 0.5px;
  }

  /* ── LIGHTNING PARTICLES ── */
  .spark {
    position: fixed;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: #F9A825;
    z-index: 2;
    pointer-events: none;
    animation: spark-float linear infinite;
    opacity: 0;
  }
  @keyframes spark-float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.5; }
    100% { transform: translateY(-20px) scale(1.5); opacity: 0; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="grid-overlay"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<!-- Sparks -->
<div class="spark" style="left:10%;animation-duration:6s;animation-delay:0s;width:3px;height:3px"></div>
<div class="spark" style="left:25%;animation-duration:8s;animation-delay:1s"></div>
<div class="spark" style="left:40%;animation-duration:5s;animation-delay:2s;background:#64B5F6"></div>
<div class="spark" style="left:55%;animation-duration:7s;animation-delay:0.5s;width:3px;height:3px"></div>
<div class="spark" style="left:70%;animation-duration:6.5s;animation-delay:1.5s;background:#FFD54F"></div>
<div class="spark" style="left:85%;animation-duration:9s;animation-delay:3s"></div>
<div class="spark" style="left:18%;animation-duration:7s;animation-delay:4s;background:#64B5F6;width:3px;height:3px"></div>
<div class="spark" style="left:62%;animation-duration:5.5s;animation-delay:2.5s"></div>
<div class="spark" style="left:92%;animation-duration:8s;animation-delay:0.8s;background:#FFD54F"></div>

<div class="wrapper">
  <div class="card">
    <div class="icon-wrap">
      <div class="icon-ring-3"></div>
      <div class="icon-ring-2"></div>
      <div class="icon-ring"></div>
      <div class="icon-core">⚡</div>
    </div>

    <div class="tag">Hệ thống quản lý</div>

    <h1>Quản Lý<br><span class="accent">Tiền Điện</span></h1>
    <p class="subtitle">Giải pháp quản lý tiền điện<br>nhà cho thuê thông minh & hiện đại</p>

    <div class="features">
      <div class="feat">
        <span class="feat-icon">📋</span>
        <div class="feat-label">Tạo phiếu điện tự động</div>
      </div>
      <div class="feat">
        <span class="feat-icon">👥</span>
        <div class="feat-label">Quản lý khách thuê</div>
      </div>
      <div class="feat">
        <span class="feat-icon">📄</span>
        <div class="feat-label">Xuất PDF & chia sẻ</div>
      </div>
    </div>

    <a class="btn-launch"
       href="https://script.google.com/macros/s/AKfycbz-czoUnKpRWZpEelyWe6raLkGL6fBGxmTIbtstwXaW8QlIeNhlGjdwpDDxHvuNYxE/exec">
      Vào ứng dụng
      <span class="btn-arrow">→</span>
    </a>

    <div class="redirect-info">
      <div class="redirect-text">Tự động chuyển hướng sau <span id="countdown">4</span> giây</div>
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>
</div>

<div class="footer">⚡ Quản Lý Tiền Điện · Hệ thống quản lý nhà cho thuê</div>

<script>
// ── COUNTDOWN ──
let secs = 4;
const el = document.getElementById('countdown');
const timer = setInterval(() => {
  secs--;
  if (el) el.textContent = secs;
  if (secs <= 0) {
    clearInterval(timer);
    window.location.href = 'https://script.google.com/macros/s/AKfycbz-czoUnKpRWZpEelyWe6raLkGL6fBGxmTIbtstwXaW8QlIeNhlGjdwpDDxHvuNYxE/exec';
  }
}, 1000);

// ── CANVAS PARTICLE NETWORK ──
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
let W, H, particles;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); init(); });

function init() {
  const count = Math.min(60, Math.floor(W * H / 18000));
  particles = Array.from({ length: count }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    r: Math.random() * 2 + 0.5,
    color: Math.random() > 0.7 ? '#F9A825' : '#1976D2'
  }));
}
init();

function draw() {
  ctx.clearRect(0, 0, W, H);
  // Update positions
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
  });
  // Draw connections
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 130) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(33,150,243,${0.18 * (1 - dist / 130)})`;
        ctx.lineWidth = 0.6;
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.stroke();
      }
    }
  }
  // Draw dots
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color === '#F9A825' ? 'rgba(249,168,37,0.7)' : 'rgba(33,150,243,0.5)';
    ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
